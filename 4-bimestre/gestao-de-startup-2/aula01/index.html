<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookSwap - NPS</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2f6fed;
        --primary-dark: #1f4eb8;
        --success: #1fa36d;
        --warning: #f2ae30;
        --danger: #d94d4d;
        --text: #1d2433;
        --muted: #5d6980;
        --border: #dfe7f4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 24px;
      }

      .header {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(34, 70, 136, 0.08);
      }

      .tag {
        display: inline-block;
        background: #eaf1ff;
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
        margin-top: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(34, 70, 136, 0.06);
      }

      .card h2 {
        margin-top: 0;
        font-size: 1.6rem;
      }

      .input-group {
        margin-top: 20px;
      }

      .input-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      label {
        font-weight: 700;
      }

      .score {
        min-width: 66px;
        text-align: center;
        font-weight: 700;
        font-size: 1.7rem;
        color: var(--primary);
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--primary);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--primary);
        color: white;
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .secondary {
        background: #edf3ff;
        color: var(--primary-dark);
      }

      .danger {
        background: #ffe7e7;
        color: #9b2d2d;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 24px;
      }

      .metric {
        background: #f8faff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 16px;
      }

      .metric .label {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 8px;
      }

      .metric strong {
        font-size: 2rem;
        display: block;
      }

      .metric.promotores strong {
        color: var(--success);
      }

      .metric.neutros strong {
        color: var(--warning);
      }

      .metric.detratores strong {
        color: var(--danger);
      }

      .metric.total strong {
        color: var(--text);
      }

      .summary {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(34, 70, 136, 0.06);
      }

      .nps-box {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        border-radius: 16px;
        background: linear-gradient(135deg, #eaf4ff 0%, #eef9f3 100%);
        border: 1px solid var(--border);
        font-weight: 800;
        font-size: clamp(2.5rem, 6vw, 4rem);
        color: var(--primary-dark);
      }

      .sentence {
        margin-top: 18px;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .sentence input {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
      }

      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <span class="tag">App de startup</span>
        <h1>BookSwap</h1>
        <p class="subtitle">Uma plataforma para trocar livros entre alunos e descobrir sua próxima leitura favorita.</p>
      </header>

      <div class="layout">
        <section class="card">
          <h2>De 0 a 10, quanto você recomendaria este app para um amigo?</h2>

          <div class="input-group">
            <div class="input-top">
              <label for="nota">Sua nota</label>
              <span id="notaAtual" class="score">8</span>
            </div>
            <input id="nota" type="range" min="0" max="10" step="1" value="8" />
          </div>

          <div class="actions">
            <button id="salvarNota" class="primary">Salvar resposta</button>
            <button id="carregarExemplo" class="secondary">Carregar exemplo da aula</button>
            <button id="limparNotas" class="danger">Limpar notas de teste</button>
          </div>
        </section>

        <aside class="summary">
          <div class="nps-box" id="npsFinal">0</div>

          <div class="sentence">
            <label for="fraseAcao">Se este NPS cair, eu vou</label>
            <input id="fraseAcao" type="text" placeholder="______." />
          </div>
        </aside>
      </div>

      <section class="stats" aria-label="Resumo do NPS">
        <div class="metric promotores">
          <span class="label">Promotores</span>
          <strong id="promotores">0</strong>
        </div>
        <div class="metric neutros">
          <span class="label">Neutros</span>
          <strong id="neutros">0</strong>
        </div>
        <div class="metric detratores">
          <span class="label">Detratores</span>
          <strong id="detratores">0</strong>
        </div>
        <div class="metric total">
          <span class="label">Total</span>
          <strong id="total">0</strong>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = 'bookswap-nps-notes';
      const EXEMPLO_AULA = [10, 9, 10, 8, 7, 6, 9, 10, 5, 8, 9, 10, 3, 7, 9, 10, 8, 6, 9, 10];

      const notaInput = document.getElementById('nota');
      const notaAtual = document.getElementById('notaAtual');
      const npsFinal = document.getElementById('npsFinal');
      const promotoresEl = document.getElementById('promotores');
      const neutrosEl = document.getElementById('neutros');
      const detratoresEl = document.getElementById('detratores');
      const totalEl = document.getElementById('total');

      function getNotas() {
        try {
          const guardadas = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(guardadas) ? guardadas : [];
        } catch (error) {
          return [];
        }
      }

      function salvarNotas(notas) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notas));
      }

      function calcularNps(notas) {
        if (notas.length === 0) {
          return 0;
        }

        const promotores = notas.filter((nota) => nota >= 9).length;
        const detratores = notas.filter((nota) => nota <= 6).length;

        return Math.round(((promotores / notas.length) - (detratores / notas.length)) * 100);
      }

      function atualizarResumo() {
        const notas = getNotas();
        const promotores = notas.filter((nota) => nota >= 9).length;
        const neutros = notas.filter((nota) => nota >= 7 && nota <= 8).length;
        const detratores = notas.filter((nota) => nota <= 6).length;
        const nps = calcularNps(notas);

        promotoresEl.textContent = promotores;
        neutrosEl.textContent = neutros;
        detratoresEl.textContent = detratores;
        totalEl.textContent = notas.length;
        npsFinal.textContent = nps;

        const npsColor = nps >= 50 ? '#1fa36d' : nps >= 0 ? '#2f6fed' : '#d94d4d';
        npsFinal.style.color = npsColor;
      }

      notaInput.addEventListener('input', () => {
        notaAtual.textContent = notaInput.value;
      });

      document.getElementById('salvarNota').addEventListener('click', () => {
        const valor = Number(notaInput.value);
        const notas = getNotas();
        notas.push(valor);
        salvarNotas(notas);
        atualizarResumo();
      });

      document.getElementById('carregarExemplo').addEventListener('click', () => {
        salvarNotas([...EXEMPLO_AULA]);
        atualizarResumo();
      });

      document.getElementById('limparNotas').addEventListener('click', () => {
        localStorage.removeItem(STORAGE_KEY);
        atualizarResumo();
      });

      notaAtual.textContent = notaInput.value;
      atualizarResumo();
    </script>
  </body>
</html>
